<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Warenkorb | PixelForge</title>
    <link rel="stylesheet" href="src/style.css">
</head>
<body>
<header class="main-header">
    <div class="logo-group">
        <a href="index.html" style="display: flex; align-items: center; text-decoration: none;">
            <img src="src/img/PixelForgeDarkerBG.png" alt="PixelForge Logo" class="logo-img">
            <img src="src/img/PixelForgeTextLogoDarkerBG.png" alt="PixelForge Text" class="logo-text">
        </a>
    </div>
    <nav>
        <a href="index.html">Shop</a>
        <a href="about.html">Über uns</a>
        <a href="warenkorb.html">Warenkorb</a>
    </nav>
</header>

<div class="container">
    <h1>Dein Warenkorb</h1>

    <div class="cart-layout" id="cart-layout">
        <div class="cart-items-container" id="cart-list">
        </div>

        <div class="checkout-box">
            <div class="total-row">
                <span>Gesamtsumme:</span>
                <span id="total-price">0,00 €</span>
            </div>
            <button class="checkout-btn" onclick="alert('Danke für dein Vertrauen! Checkout-Prozess startet...')">
                Jetzt sicher bezahlen
            </button>
            <p style="font-size: 0.8rem; color: #b3b3b3; margin-top: 15px; text-align: center;">
                🔒 SSL verschlüsselt & Sicher
            </p>
        </div>
    </div>

    <a href="index.html" class="back-to-shop"> <img src="src/img/PixelForgeTextLogoDarkerBG.png" alt="PixelForge Logo" class="logo-text"></a>
</div>


<footer style="margin-top: 100px; padding: 40px 0; border-top: 1px solid #282830; text-align: center;">
    <div style="margin-bottom: 20px;">
        <img src="src/img/PixelForgeDarkerBG.png" alt="Logo" style="height: 30px; opacity: 0.5;">
    </div>
    <div style="display: flex; justify-content: center; gap: 30px; margin-bottom: 20px;">
        <a href="about.html" style="color: #b3b3b3; text-decoration: none; font-size: 0.9rem;">Über uns</a>
        <a href="license.html" style="color: #b3b3b3; text-decoration: none; font-size: 0.9rem;">Lizenzbestimmungen</a>
        <a href="impressum.html" style="color: #b3b3b3; text-decoration: none; font-size: 0.9rem;">Impressum</a>
        <a href="barrierefreiheit.html" style="color: #b3b3b3; text-decoration: none; font-size: 0.9rem;">Barrierefreiheit</a>
        <a href="datenschutz.html" style="color: #b3b3b3; text-decoration: none; font-size: 0.9rem;">Datenschutz</a>
        <a href="credits.html" style="color: #b3b3b3; text-decoration: none; font-size: 0.9rem;">Credits</a>
    </div>
    <p style="color: #666; font-size: 0.8rem;">&copy; 2026 PixelForge. Alle Rechte vorbehalten.</p>
    <p style="color: #666; font-size: 0.8rem;"> Empowering Creators.</p>
</footer>

<script>
    function renderCart() {
        const cartList = document.getElementById('cart-list');
        const totalPriceEl = document.getElementById('total-price');
        const cartLayout = document.getElementById('cart-layout');

        let cart = JSON.parse(localStorage.getItem('pixelForgeCart')) || [];

        if (cart.length === 0) {
            cartLayout.innerHTML = '<div class="empty-msg"><h2>Dein Warenkorb ist leer.</h2>' +
                '<p>Füge Produkte aus dem Shop hinzu.</p></div>';
            return;
        }

        cartList.innerHTML = '';
        let total = 0;

        cart.forEach((item, index) => {
            total += item.price;
            cartList.innerHTML += `
                <div class="cart-item">
                    <img src="${item.img}" alt="${item.name}">
                    <div class="item-details">
                        <h3>${item.name}</h3>
                    </div>
                    <div class="item-price">${item.price.toFixed(2)} €</div>
                    <button class="remove-btn" onclick="removeItem(${index})">Löschen</button>
                </div>
            `;
        });

        totalPriceEl.innerText = total.toFixed(2) + ' €';
    }

    function removeItem(index) {
        let cart = JSON.parse(localStorage.getItem('pixelForgeCart')) || [];
        cart.splice(index, 1);
        localStorage.setItem('pixelForgeCart', JSON.stringify(cart));
        renderCart();
    }

    renderCart();
</script>
</body>
</html>
